name: Render Sleep/Meditation Video

on:
  repository_dispatch:
    types: [render_sleep_video]

permissions:
  contents: write

concurrency:
  group: sleep-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          pip install gdown

      - name: Save payload
        run: |
          cat > payload.json <<'JSON'
          ${{ toJson(github.event.client_payload) }}
          JSON
          cat payload.json | jq .

      - name: Download audio from Google Drive
        run: |
          AUDIO_ID=$(jq -r '.source_audio_file_id' payload.json)

          echo "Downloading audio file: $AUDIO_ID"

          if [ -z "$AUDIO_ID" ] || [ "$AUDIO_ID" = "null" ]; then
            echo "Missing source_audio_file_id"
            exit 1
          fi

          gdown "https://drive.google.com/uc?id=$AUDIO_ID" -O audio.mp3
          ls -lh audio.mp3

      - name: Download AI video clips
        run: |
          mkdir -p clips

          CLIP_1_URL=$(jq -r '.clip_1_url' payload.json)
          CLIP_2_URL=$(jq -r '.clip_2_url' payload.json)
          CLIP_3_URL=$(jq -r '.clip_3_url' payload.json)

          echo "Clip 1 URL: $CLIP_1_URL"
          echo "Clip 2 URL: $CLIP_2_URL"
          echo "Clip 3 URL: $CLIP_3_URL"

          if [ -z "$CLIP_1_URL" ] || [ "$CLIP_1_URL" = "null" ]; then
            echo "Missing clip_1_url"
            exit 1
          fi

          if [ -z "$CLIP_2_URL" ] || [ "$CLIP_2_URL" = "null" ]; then
            echo "Missing clip_2_url"
            exit 1
          fi

          if [ -z "$CLIP_3_URL" ] || [ "$CLIP_3_URL" = "null" ]; then
            echo "Missing clip_3_url"
            exit 1
          fi

          curl -L "$CLIP_1_URL" -o clips/clip_1.mp4
          curl -L "$CLIP_2_URL" -o clips/clip_2.mp4
          curl -L "$CLIP_3_URL" -o clips/clip_3.mp4

          ls -lh clips

      - name: Normalize clips
        run: |
          mkdir -p normalized

          ffmpeg -y -i clips/clip_1.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_1.mp4

          ffmpeg -y -i clips/clip_2.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_2.mp4

          ffmpeg -y -i clips/clip_3.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_3.mp4

          ls -lh normalized

      - name: Build master loop with smooth transitions
        run: |
          ffmpeg -y \
            -i normalized/clip_1.mp4 \
            -i normalized/clip_2.mp4 \
            -i normalized/clip_3.mp4 \
            -i normalized/clip_1.mp4 \
            -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1.2:offset=8.8[v1]; [v1][2:v]xfade=transition=fade:duration=1.2:offset=17.6[v2]; [v2][3:v]xfade=transition=fade:duration=1.2:offset=26.4[vout]; [vout]trim=duration=27.6,setpts=PTS-STARTPTS[vfinal]" \
            -map "[vfinal]" \
            -c:v libx264 \
            -preset fast \
            -b:v 950k \
            -maxrate 1100k \
            -bufsize 2200k \
            -pix_fmt yuv420p \
            master_loop.mp4

          echo "Master loop size:"
          ls -lh master_loop.mp4

      - name: Render final video fast
        run: |
          DURATION=$(jq -r '.duration_seconds // "14400"' payload.json)
          OUTFILE=$(jq -r '.final_filename // "deep-sleep-frequency-4-hours.mp4"' payload.json)

          if [ -z "$DURATION" ] || [ "$DURATION" = "null" ]; then
            DURATION=14400
          fi

          if [ -z "$OUTFILE" ] || [ "$OUTFILE" = "null" ]; then
            OUTFILE="deep-sleep-frequency-4-hours.mp4"
          fi

          echo "Rendering duration: $DURATION seconds"
          echo "Output file: $OUTFILE"

          ffmpeg -y \
            -stream_loop -1 -i master_loop.mp4 \
            -stream_loop -1 -i audio.mp3 \
            -t "$DURATION" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 96k \
            -movflags +faststart \
            "$OUTFILE"

          echo "Final video:"
          ls -lh "$OUTFILE"

          FILE_SIZE=$(stat -c%s "$OUTFILE")
          echo "Final file size in bytes: $FILE_SIZE"
          echo "GitHub Release asset limit: 2147483648 bytes"

          echo "OUTFILE=$OUTFILE" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      - name: Create GitHub release with rendered video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="render-${{ github.run_id }}-$(date +%Y%m%d-%H%M%S)"
          RELEASE_TITLE="Rendered Sleep Video ${{ github.run_id }}"

          echo "Creating release: $TAG"
          echo "File size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -ge 2147483648 ]; then
            echo "File is too large for GitHub Release asset."
            echo "Max allowed size is 2147483648 bytes."
            exit 1
          fi

          gh release create "$TAG" "$OUTFILE" \
            --title "$RELEASE_TITLE" \
            --notes "Automatically rendered sleep/meditation video."

          VIDEO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUTFILE}"

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VIDEO_URL=$VIDEO_URL" >> $GITHUB_ENV

          echo "Video URL: $VIDEO_URL"

      - name: Call Make webhook after render
        run: |
          TITLE=$(jq -r '.title // "Deep Sleep Frequency Music"' payload.json)
          DESCRIPTION=$(jq -r '.description // "Relaxing sleep and meditation music."' payload.json)
          TAGS=$(jq -c '.tags // []' payload.json)
          FILENAME=$(jq -r '.final_filename // env.OUTFILE' payload.json)
          DURATION=$(jq -r '.duration_seconds // "14400"' payload.json)
          PRIVACY=$(jq -r '.privacy_status // "private"' payload.json)
          CATEGORY=$(jq -r '.category_id // "10"' payload.json)

          jq -n \
            --arg video_url "$VIDEO_URL" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg filename "$FILENAME" \
            --arg duration_seconds "$DURATION" \
            --arg privacy_status "$PRIVACY" \
            --arg category_id "$CATEGORY" \
            --argjson tags "$TAGS" \
            '{
              video_url: $video_url,
              title: $title,
              description: $description,
              tags: $tags,
              filename: $filename,
              duration_seconds: $duration_seconds,
              privacy_status: $privacy_status,
              category_id: $category_id,
              made_for_kids: false,
              contains_synthetic_media: true
            }' > make_payload.json

          cat make_payload.json

          curl -X POST "https://hook.eu1.make.com/pfbxomjur1dxwvitezo354tv3hpyso85" \
            -H "Content-Type: application/json" \
            --data-binary @make_payload.json

      - name: Upload video artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sleep-video
          path: "*.mp4"
