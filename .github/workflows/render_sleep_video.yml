name: Render Sleep/Meditation Video

on:
  repository_dispatch:
    types: [render_sleep_video]

permissions:
  contents: write

concurrency:
  group: sleep-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          pip install gdown google-api-python-client google-auth google-auth-httplib2

      - name: Save payload
        run: |
          cat > payload.json <<'JSON'
          ${{ toJson(github.event.client_payload) }}
          JSON
          cat payload.json | jq .

      - name: Download audio from Google Drive
        run: |
          AUDIO_ID=$(jq -r '.source_audio_file_id' payload.json)

          echo "Downloading audio file: $AUDIO_ID"

          if [ -z "$AUDIO_ID" ] || [ "$AUDIO_ID" = "null" ]; then
            echo "Missing source_audio_file_id"
            exit 1
          fi

          gdown "https://drive.google.com/uc?id=$AUDIO_ID" -O audio.mp3
          ls -lh audio.mp3

      - name: Download AI video clips
        run: |
          mkdir -p clips

          CLIP_1_URL=$(jq -r '.clip_1_url' payload.json)
          CLIP_2_URL=$(jq -r '.clip_2_url' payload.json)
          CLIP_3_URL=$(jq -r '.clip_3_url' payload.json)

          echo "Clip 1 URL: $CLIP_1_URL"
          echo "Clip 2 URL: $CLIP_2_URL"
          echo "Clip 3 URL: $CLIP_3_URL"

          if [ -z "$CLIP_1_URL" ] || [ "$CLIP_1_URL" = "null" ]; then
            echo "Missing clip_1_url"
            exit 1
          fi

          if [ -z "$CLIP_2_URL" ] || [ "$CLIP_2_URL" = "null" ]; then
            echo "Missing clip_2_url"
            exit 1
          fi

          if [ -z "$CLIP_3_URL" ] || [ "$CLIP_3_URL" = "null" ]; then
            echo "Missing clip_3_url"
            exit 1
          fi

          curl -L "$CLIP_1_URL" -o clips/clip_1.mp4
          curl -L "$CLIP_2_URL" -o clips/clip_2.mp4
          curl -L "$CLIP_3_URL" -o clips/clip_3.mp4

          ls -lh clips

      - name: Normalize clips
        run: |
          mkdir -p normalized

          ffmpeg -y -i clips/clip_1.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_1.mp4

          ffmpeg -y -i clips/clip_2.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_2.mp4

          ffmpeg -y -i clips/clip_3.mp4 \
            -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" \
            -an \
            -c:v libx264 \
            -preset fast \
            -crf 22 \
            normalized/clip_3.mp4

          ls -lh normalized

      - name: Build master loop with smooth transitions
        run: |
          ffmpeg -y \
            -i normalized/clip_1.mp4 \
            -i normalized/clip_2.mp4 \
            -i normalized/clip_3.mp4 \
            -i normalized/clip_1.mp4 \
            -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1.2:offset=8.8[v1]; [v1][2:v]xfade=transition=fade:duration=1.2:offset=17.6[v2]; [v2][3:v]xfade=transition=fade:duration=1.2:offset=26.4[vout]; [vout]trim=duration=27.6,setpts=PTS-STARTPTS[vfinal]" \
            -map "[vfinal]" \
            -c:v libx264 \
            -preset fast \
            -b:v 950k \
            -maxrate 1100k \
            -bufsize 2200k \
            -pix_fmt yuv420p \
            master_loop.mp4

          echo "Master loop size:"
          ls -lh master_loop.mp4

      - name: Render final video fast
        run: |
          DURATION=$(jq -r '.duration_seconds // "14400"' payload.json)
          OUTFILE=$(jq -r '.final_filename // "deep-sleep-frequency-4-hours.mp4"' payload.json)

          if [ -z "$DURATION" ] || [ "$DURATION" = "null" ]; then
            DURATION=14400
          fi

          if [ -z "$OUTFILE" ] || [ "$OUTFILE" = "null" ]; then
            OUTFILE="deep-sleep-frequency-4-hours.mp4"
          fi

          echo "Rendering duration: $DURATION seconds"
          echo "Output file: $OUTFILE"

          ffmpeg -y \
            -stream_loop -1 -i master_loop.mp4 \
            -stream_loop -1 -i audio.mp3 \
            -t "$DURATION" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v copy \
            -c:a aac \
            -b:a 96k \
            -movflags +faststart \
            "$OUTFILE"

          echo "Final video:"
          ls -lh "$OUTFILE"

          FILE_SIZE=$(stat -c%s "$OUTFILE")
          echo "Final file size in bytes: $FILE_SIZE"

          echo "OUTFILE=$OUTFILE" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV

      - name: Upload video directly to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python <<'PY'
          import os
          import json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open("payload.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          title = payload.get("title") or "Deep Sleep Music | 4 Hours Peaceful Night Sky Meditation"
          description = payload.get("description") or (
              "Relax into deep rest with peaceful deep sleep music, calming night sky ambience, "
              "and soothing meditation sounds created for relaxation, sleep, focus, and quiet evening routines."
          )

          category_id = str(payload.get("category_id") or "10")
          privacy_status = payload.get("privacy_status") or "private"
          outfile = os.environ.get("OUTFILE", "deep-sleep-frequency-4-hours.mp4")

          tags = [
              "deep sleep music",
              "sleep music",
              "meditation music",
              "relaxing music",
              "night sky music",
              "4 hours sleep music",
              "calming music",
              "peaceful sleep",
              "ambient sleep music",
              "healing frequency music",
              "reiki music",
              "stress relief music",
              "relaxation music",
              "sleep meditation",
              "deep relaxation"
          ]

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          creds.refresh(Request())

          youtube = build("youtube", "v3", credentials=creds)

          body = {
              "snippet": {
                  "title": title[:100],
                  "description": description[:5000],
                  "tags": tags,
                  "categoryId": category_id
              },
              "status": {
                  "privacyStatus": privacy_status,
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              outfile,
              chunksize=8 * 1024 * 1024,
              resumable=True,
              mimetype="video/mp4"
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          print("YouTube upload complete.")
          print("Video ID:", response.get("id"))
          print("Video URL:", f"https://www.youtube.com/watch?v={response.get('id')}")
          PY

      - name: Create GitHub release backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="render-${{ github.run_id }}-$(date +%Y%m%d-%H%M%S)"
          RELEASE_TITLE="Rendered Sleep Video ${{ github.run_id }}"

          echo "Creating backup release: $TAG"
          echo "File size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -ge 2147483648 ]; then
            echo "File is too large for GitHub Release asset."
            echo "Skipping GitHub release backup."
            exit 0
          fi

          gh release create "$TAG" "$OUTFILE" \
            --title "$RELEASE_TITLE" \
            --notes "Automatically rendered sleep/meditation video backup."

      - name: Upload video artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sleep-video
          path: "*.mp4"
