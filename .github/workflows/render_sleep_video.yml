name: Render Sleep/Meditation Video

on:
  repository_dispatch:
    types: [render_sleep_video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          pip install gdown

      - name: Save payload
        run: |
          cat > payload.json <<'JSON'
          ${{ toJson(github.event.client_payload) }}
          JSON
          cat payload.json | jq .

      - name: Download audio from Google Drive
        run: |
          AUDIO_ID=$(jq -r '.source_audio_file_id' payload.json)
          echo "Downloading audio file: $AUDIO_ID"
          gdown "https://drive.google.com/uc?id=$AUDIO_ID" -O audio.mp3
          ls -lh audio.mp3

      - name: Download AI video clips
        run: |
          mkdir -p clips
          curl -L "$(jq -r '.clip_1_url' payload.json)" -o clips/clip_1.mp4
          curl -L "$(jq -r '.clip_2_url' payload.json)" -o clips/clip_2.mp4
          curl -L "$(jq -r '.clip_3_url' payload.json)" -o clips/clip_3.mp4
          ls -lh clips

      - name: Normalize clips
        run: |
          mkdir -p normalized
          for f in clips/*.mp4; do
            base=$(basename "$f")
            ffmpeg -y -i "$f" -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,format=yuv420p" -an -c:v libx264 -preset veryfast -crf 28 "normalized/$base"
          done

      - name: Build master loop with smooth transitions
        run: |
          ffmpeg -y \
            -i normalized/clip_1.mp4 \
            -i normalized/clip_2.mp4 \
            -i normalized/clip_3.mp4 \
            -i normalized/clip_1.mp4 \
            -filter_complex "[0:v][1:v]xfade=transition=fade:duration=1.2:offset=8.8[v1]; [v1][2:v]xfade=transition=fade:duration=1.2:offset=17.6[v2]; [v2][3:v]xfade=transition=fade:duration=1.2:offset=26.4[vout]" \
            -map "[vout]" \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p \
            master_loop.mp4

      - name: Render final test video
        run: |
          DURATION=$(jq -r '.duration_seconds' payload.json)
          OUTFILE=$(jq -r '.final_filename' payload.json)

          if [ -z "$DURATION" ] || [ "$DURATION" = "null" ]; then
            DURATION=600
          fi

          if [ -z "$OUTFILE" ] || [ "$OUTFILE" = "null" ]; then
            OUTFILE="test-sleep-video.mp4"
          fi

          echo "Rendering duration: $DURATION seconds"
          echo "Output file: $OUTFILE"

          ffmpeg -y -stream_loop -1 -i master_loop.mp4 -stream_loop -1 -i audio.mp3 -t "$DURATION" -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$OUTFILE"

          ls -lh "$OUTFILE"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-test-video
          path: test-sleep-video.mp4
